openapi: 3.0.3
info:
  title: Vyntaro PF Bank-Grade API
  version: 3.0.0
servers:
  - url: /api
components:
  schemas:
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error: { type: string }
    LedgerEntryCreate:
      type: object
      required: [debitAccountId, creditAccountId, amountMinor, currency, referenceId, referenceType]
      properties:
        debitAccountId: { type: string }
        creditAccountId: { type: string }
        amountMinor: { type: string, pattern: '^[0-9]+$' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        referenceId: { type: string }
        referenceType: { type: string }
    ShopOrderCreate:
      type: object
      required: [shopId, shopName, orderId, orderDate, orderStatus, totalAmount, currency, items]
      properties:
        shopId: { type: string }
        shopName: { type: string }
        shopLocation: { type: string }
        orderId: { type: string }
        orderDate: { type: string, format: date-time }
        orderStatus: { type: string, enum: [pending, confirmed, packed, delivered, cancelled] }
        totalAmount: { type: string }
        paymentReference: { type: string }
        currency: { type: string }
        items:
          type: array
          items:
            type: object
            required: [itemName, category, quantity, unitPrice, totalPrice]
            properties:
              itemName: { type: string }
              category: { type: string }
              quantity: { type: number }
              unitPrice: { type: string }
              totalPrice: { type: string }
    TripCreate:
      type: object
      required: [pickupLocationText, pickupLatitude, pickupLongitude, dropLocationText, dropLatitude, dropLongitude, tripStatus, tripDate]
      properties:
        pickupLocationText: { type: string }
        pickupLatitude: { type: number }
        pickupLongitude: { type: number }
        dropLocationText: { type: string }
        dropLatitude: { type: number }
        dropLongitude: { type: number }
        distanceEstimate: { type: number }
        fareEstimate: { type: string }
        actualFare: { type: string }
        tripStatus: { type: string, enum: [requested, accepted, in_progress, completed, cancelled] }
        tripDate: { type: string, format: date-time }
        vehicleType: { type: string, enum: [auto, car] }
        vehicleNumber: { type: string }
        driverName: { type: string }
        driverId: { type: string }
paths:
  /auth/register:
    post:
      summary: Register user with trial and referral support
  /finance/ledger/entries:
    post:
      summary: Create immutable double-entry ledger row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerEntryCreate'
      responses:
        '201': { description: Created }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /finance/shop/orders:
    post:
      summary: Persist shop order and itemized purchase history
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShopOrderCreate' }
  /finance/trips:
    post:
      summary: Persist auto/car booking lifecycle data
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripCreate' }
  /finance/subscriptions/current:
    get:
      summary: Fetch user subscription with trial/referral state
  /finance/payments/webhook:
    post:
      summary: Verify idempotent gateway callback and post accounting entries
  /finance/statements/generate:
    post:
      summary: Generate monthly statement with purchases, travel, GST, referral benefits and AI summary
  /finance/insights:
    get:
      summary: AI insights endpoint for spending trends/anomaly hints
  /superadmin/analytics/revenue:
    get:
      summary: Fetch MRR/ARR/churn and GST aggregates
